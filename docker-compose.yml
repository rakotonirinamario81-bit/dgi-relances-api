version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: relance-fiscale-db
    environment:
      POSTGRES_DB: relance_fiscale
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend/relance-fiscale-api
      dockerfile: Dockerfile
    container_name: relance-fiscale-api
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=relance_fiscale
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend/relance-fiscale-web
      dockerfile: Dockerfile
    container_name: relance-fiscale-web
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api/v1
    depends_on:
      - api

volumes:
  pgdata:
